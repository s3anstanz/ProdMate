name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The job names below ("Tests (...)" and "Real audit tools") are required status checks
# in main's branch protection. Renaming a job or a matrix entry means updating that list too,
# or pull requests wait forever on a check that no longer exists.

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]
        # setup-python has no 3.9 build for the newest Ubuntu; test 3.9 on 24.04 instead.
        # 3.9 stays because it's what macOS's built-in python3 ships.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests/prodmate -t . -v
      - name: Checklist linter
        run: python skills/prodmate/scripts/lint_checklists.py skills/prodmate/references

  # The unit tests use recorded tool output; this runs the real gitleaks and osv-scanner,
  # so a new tool version that changes its output or behavior fails here.
  real-tools:
    name: Real audit tools
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install gitleaks and osv-scanner (pinned and checksum-verified)
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          curl -sSfL -o "$bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum --check
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: gitleaks version && osv-scanner --version
      - name: Real-tool checks
        run: python tests/prodmate/integration_check.py
